name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Build application
        run: wails3 task build

      - name: Package release assets
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $exe = "among-us-mod-launcher-$version-windows-x64.exe"
          Copy-Item "bin/among-us-mod-launcher.exe" $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $exe" | Out-File -FilePath "$exe.sha256" -Encoding ascii -NoNewline
          Write-Host "SHA256: $hash"
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.exe }}
            ${{ steps.package.outputs.exe }}.sha256
