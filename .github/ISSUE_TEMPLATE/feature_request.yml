name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved and the idea you have for it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is frustrating or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the launcher to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      description: Mockups, related mods, or links.
