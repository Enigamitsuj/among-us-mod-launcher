name: Bug report
description: Report something that is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please include enough detail to reproduce the issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the launcher
        2. Select Town of Us: Mira
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Among Us platform
      options:
        - Steam
        - Epic
        - Itch
        - Xbox / Microsoft Store
        - Unknown / not detected
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      description: Screenshots, logs, Among Us version, or anything else useful.
